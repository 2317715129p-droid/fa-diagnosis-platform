# FA Diagnosis System MVP — full stack (FA + Dify + Ollama)
#
# Offline / intranet deployment (NO internet on the target host):
#   1) On a machine WITH internet, run:  bash deploy/offline-prep.sh
#   2) Copy fa-diagnosis-offline.tar.gz to the intranet server
#   3) Extract, then:  docker load -i deploy-images.tar
#   4) cp .env.example .env && docker compose -p fa up -d --build
#   5) After startup, configure Dify to use local Ollama models
#
# Note: .env.example is the unified template for both offline and public deployments
#
# For offline deployment, preload images with: docker save / docker load
# All image tags below are pinned (no :latest).
#
# Local LLM: Ollama runs as a service (ollama:11434), accessible from Dify.
# After deployment, configure Dify: Settings → Model Providers → Ollama → http://ollama:11434
#
# Project name: "fa" ensures consistent volume naming (e.g., fa_ollama_models)
name: fa

networks:
  fa_network:
    driver: bridge
  default:
    driver: bridge

volumes:
  fa_data:
  dify_storage:
  postgres_data:
  redis_data:
  weaviate_data:
  ollama_models:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # FA Diagnosis — FastAPI backend (builds from offline-packages wheels)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fa-backend:1.0.0
    container_name: fa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DIFY_API_URL: ${DIFY_API_URL:-http://dify-nginx:80}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_TRANSLATE_API_KEY: ${DIFY_TRANSLATE_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/fa_data.db}
    volumes:
      - fa_data:/app/data
      - ./static/reports:/app/static/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dify-nginx:
        condition: service_started
    networks:
      - fa_network
      - default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # FA Diagnosis — React UI (nginx; expects pre-built ./dist from offline-prep)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: fa-frontend:1.0.0
    container_name: fa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fa_network
      - default

  # ---------------------------------------------------------------------------
  # Dify — API / Worker / Web (official images, pinned tags — no :latest)
  # ---------------------------------------------------------------------------
  dify-api:
    image: langgenius/dify-api:1.15.0
    container_name: dify-api
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-fa-dify-change-me-in-production}
      INIT_PASSWORD: ${DIFY_INIT_PASSWORD:-admin123456}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost}
      FILES_URL: ${FILES_URL:-http://localhost}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-difyai123456}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dify}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      REDIS_USE_SSL: "false"
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/1
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYjkNmNTM}
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${CODE_EXECUTION_API_KEY:-5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a}
      MIGRATION_ENABLED: "true"
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://fa-plugin-daemon:5002}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a}
      GUNICORN_TIMEOUT: "2000"
      HTTP_REQUEST_MAX_READ_TIMEOUT: "2000"
      HTTP_REQUEST_MAX_WRITE_TIMEOUT: "2000"
      CODE_EXECUTION_READ_TIMEOUT: "2000"
      PLUGIN_DAEMON_TIMEOUT: "2000"
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      weaviate:
        condition: service_started
    networks:
      - fa_network

  dify-worker:
    image: langgenius/dify-api:1.15.0
    container_name: dify-worker
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY:-sk-fa-dify-change-me-in-production}
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-http://localhost}
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://localhost}
      SERVICE_API_URL: ${SERVICE_API_URL:-http://localhost}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost}
      FILES_URL: ${FILES_URL:-http://localhost}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-difyai123456}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dify}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      REDIS_USE_SSL: "false"
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/1
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-WVF5YThaHlkYjkNmNTM}
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      CODE_EXECUTION_API_KEY: ${CODE_EXECUTION_API_KEY:-5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a}
      PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://fa-plugin-daemon:5002}
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY:-5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a}
      GUNICORN_TIMEOUT: "2000"
      PLUGIN_DAEMON_TIMEOUT: "2000"
      HTTP_REQUEST_MAX_READ_TIMEOUT: "2000"
      HTTP_REQUEST_MAX_WRITE_TIMEOUT: "2000"
      CODE_EXECUTION_READ_TIMEOUT: "2000"
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      - dify-api
      - postgres
      - redis
      - weaviate
    networks:
      - fa_network

  dify-web:
    image: langgenius/dify-web:1.15.0
    container_name: dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      APP_API_URL: ${APP_API_URL:-}
      SERVICE_API_URL: ${SERVICE_API_URL:-}
    networks:
      - fa_network

  # ---------------------------------------------------------------------------
  # Dify dependencies (pinned tags — no :latest)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.8-alpine
    container_name: fa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-difyai123456}
      POSTGRES_DB: ${POSTGRES_DB:-dify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2.14-alpine
    container_name: fa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    volumes:
      - redis_data:/data
    networks:
      - fa_network

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    container_name: fa-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-WVF5YThaHlkYjkNmNTM}
      AUTHENTICATION_APIKEY_USERS: dify@example.com
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: dify@example.com
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - fa_network

  # ---------------------------------------------------------------------------
  # Local LLM — Ollama (intranet-friendly, runs models locally)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.7
    container_name: fa-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - fa_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Dify reverse proxy (port 80) — FA backend calls http://dify-nginx:80
  dify-nginx:
    image: nginx:1.27-alpine
    container_name: dify-nginx
    restart: unless-stopped
    volumes:
      - ./dify/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - dify-api
      - dify-web
    networks:
      - fa_network
      - default

  # ---------------------------------------------------------------------------
  # Dify Plugin Daemon (local plugin execution)
  # ---------------------------------------------------------------------------
  plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.3-local
    container_name: fa-plugin-daemon
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-difyai123456}
      DB_NAME: dify
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-difyai123456}
      REDIS_DB: '0'
      SERVER_PORT: '5002'
      SERVER_KEY: 5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: 5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: '5001'
      PLUGIN_WORKING_PATH: /app/storage
      PLUGIN_MAX_PACKAGE_SIZE: '15728640'
      LOG_LEVEL: INFO
      PLUGIN_MAX_EXECUTION_TIMEOUT: '2000'
      PLUGIN_MAX_REQUEST_TIMEOUT: '2000'
    volumes:
      - dify_storage:/app/storage
    depends_on:
      - redis
      - postgres
    networks:
      - fa_network
      - default

  # ---------------------------------------------------------------------------
  # Dify Sandbox (code execution)
  # ---------------------------------------------------------------------------
  dify-sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: 5dd1e115f395d96d5031f877c736e68492562fb6fd6f87a95689b6b9b9c7f80a
      GIN_MODE: release
      WORKERS: 4
    networks:
      - fa_network
      - default
