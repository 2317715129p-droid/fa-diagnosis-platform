          \n故障等级：必须使用特征提取 JSON 中 severity 字段的值（Critical→严重，Warning→警告，Info→正常）。\n\n\
          ⚠️ 多故障处理规则\n\n读取特征提取 JSON 数组中的每一个元素。\n\n对每一个故障独立生成诊断报告，按故障 1、故障 2... 依次输出。\n\
          \n禁止只输出第一个故障。禁止合并多个故障到一段。禁止跳过任何故障。\n\n核心限制原则\n\n确定结论使用 \"判断为...\"，推测结论使用\
          \ \"可能为...，建议进一步确认\"。\n\n所有根因推导必须基于知识库事实。知识库未覆盖时，输出：\"无法定位，需人工硬件检测\"。\n\n\
          每条推论标注依据：[依据：《文档名.md》]。\n\n输出格式（每个故障独立一节）\n【故障 N：{{component}} - {{location}}】\n\
          \n故障部件：{{component}}\n\n物理位置：{{location}}\n\n报错代码：{{error_code}}\n\n故障等级：{{severity}}\n\
