    - data:
        code: "from __future__ import annotations\n\nimport json\nimport re\nfrom\
          \ typing import Any\n\n# ---------------------------------------------------------------------------\n\
          # 降噪词表\n# ---------------------------------------------------------------------------\n\
          \n_NOISE_PATTERNS = [\n    re.compile(p, re.IGNORECASE)\n    for p in [\n\
          \        r\"\\bsystemd\\b\",\n        r\"\\bcron\\b\",\n        r\"\\bsshd\\\
          b\",\n        r\"\\bdhcp\\b\",\n        r\"\\bNetworkManager\\b\",\n   \
          \     r\"\\bext[234]\\b\",\n        r\"\\bxfs\\b\",\n        r\"\\bnfs\\\
          b\",\n        r\"\\baudit\\b\",\n        r\"\\bkernel:\\s*\\[.*\\]\\s*(?:INFO|DEBUG)\"\
          ,\n    ]\n]\n\n_HARDWARE_KEEP_PATTERNS = [\n    re.compile(p, re.IGNORECASE)\n\
          \    for p in [\n        r\"Hardware\\s+Error\",\n        r\"Hardware\\\
          s+event\",\n        r\"\\bMCE\\b\",\n        r\"Machine\\s+Check\",\n  \
          \      r\"\\bEDAC\\b\",\n        r\"Temperature\",\n        r\"\\bFan\\\
          b\",\n        r\"Voltage\",\n        r\"\\bSMART\\b\",\n        r\"pcieport\"\
          ,\n        r\"\\bAER\\b\",\n        r\"NIC\\s+Link\",\n        r\"\\bmcelog\\\
          b\",\n        r\"IPMI\",\n        r\"\\bSEL\\b\",\n        r\"Corrected\\\
          s+error\",\n        r\"Uncorrected\",\n        r\"\\bSTATUS\\b\",\n    \
          \    r\"\\bMCA:\",\n        r\"Error\\s+code\",\n        r\"\\bBank\\b\"\
          ,\n        r\"DIMM\",\n        r\"\\bCPU\\s+\\d+\",\n    ]\n]\n\n# MCE 块起始\
          \ / 续行\n_MCE_START = re.compile(\n    r\"Hardware\\s+event|Hardware\\s+Error|Machine\\\
          s+Check|\\bmce:|^MCE\\s\",\n    re.IGNORECASE,\n)\n# Bug1: 全部 IGNORECASE，兼容\
          \ IBM BANK / STATUS 等大写格式\n_MCE_CONTINUE = re.compile(\n    r\"STATUS|MCGSTATUS|MCGCAP|CPUID|MCA:|Bank|Error\\\
          s+code|MISC|TIME|\"\n    r\"Corrected\\s+error|Uncorrected|SOCKETID|APICID|PROCESSOR|\"\
          \n    r\"^\\s*CPU\\s+\\d+|^\\s*MCE\\s+\\d+|BINIT|timeout\",\n    re.IGNORECASE,\n\
          )\n\n_EDAC_START = re.compile(r\"\\bEDAC\\b|MEMORY\\s+CONTROLLER|DIMM\\\
          s+\\d+\", re.IGNORECASE)\n_EDAC_CONTINUE = re.compile(\n    r\"EDAC|DIMM|Channel|CSROW|mc\\\
          d+|CE|UE|page:|offset:|grain:\",\n    re.IGNORECASE,\n)\n\n# Bug3: 词边界，避免\
          \ AERR 误命中 AER\n_PCIE_START = re.compile(r\"pcieport|\\bAER\\b|PCIe\\s+Bus\\\
          s+Error\", re.IGNORECASE)\n_PCIE_CONTINUE = re.compile(\n    r\"pcieport|\\\
          bAER\\b|severity|severity_status|device_status|Uncorrected|\"\n    r\"Corrected|TLP|Receiver\\\
          s+Error|Bad\\s+TLP\",\n    re.IGNORECASE,\n)\n\n_IPMI_SENSOR = re.compile(\n\
          \    r\"(?:Temperature|Temp|Fan|Voltage|PSU|Power\\s+Supply).{0,40}\"\n\
          \    r\"(?:critical|warning|failed|out\\s+of\\s+range|\\d+\\s*°?C|\\d+\\\
          s*RPM)\",\n    re.IGNORECASE,\n)\n_SMART = re.compile(\n    r\"SMART|Disk|ata\\\
          d+|nvme\\d+.*(fail|error|reallocated|UNC|temperature)\",\n    re.IGNORECASE,\n\
          )\n_NIC = re.compile(\n    r\"NIC\\s+Link|eth\\d+.*(?:link\\s+down|carrier)|ixgbe|i40e|mlx\\\
          d+.*error\",\n    re.IGNORECASE,\n)\n\n_RE_CPU = re.compile(r\"CPU\\s+(\\\
          d+)\", re.IGNORECASE)\n_RE_BANK = re.compile(r\"BANK\\s+(\\d+)\", re.IGNORECASE)\n\
          _RE_SOCKET = re.compile(r\"SOCKETID\\s+(\\d+)\", re.IGNORECASE)\n# Bug2:\
          \ STATUS / Error code 均可选 0x 前缀\n_RE_ERROR_CODE = re.compile(r\"Error\\\
          s+code\\s+(?:0x)?([0-9a-fA-F]+)\", re.IGNORECASE)\n_RE_STATUS = re.compile(r\"\
          STATUS\\s+(?:0x)?([0-9a-fA-F]+)\", re.IGNORECASE)\n_RE_ERR_DESC = re.compile(r\"\
          Error\\s+code\\s+\\w+:\\s*(.+)\", re.IGNORECASE)\n_RE_MCA_DESC = re.compile(r\"\
          MCA:\\s*(.+)\", re.IGNORECASE)\n_RE_BINIT = re.compile(r\"(timeout\\s+BINIT.*)\"\
          , re.IGNORECASE)\n\n\ndef _has_hardware_signal(line: str) -> bool:\n   \
          \ return any(p.search(line) for p in _HARDWARE_KEEP_PATTERNS)\n\n\ndef _is_noise_only(line:\
          \ str) -> bool:\n    if _has_hardware_signal(line):\n        return False\n\
          \    return any(p.search(line) for p in _NOISE_PATTERNS)\n\n\ndef denoise_log(log_text:\
          \ str) -> tuple[str, list[str]]:\n    \"\"\"过滤非硬件噪音行；含硬件关键词的行一律保留。\"\"\"\
          \n    kept: list[str] = []\n    dropped: list[str] = []\n    for raw in\
          \ (log_text or \"\").splitlines():\n        line = raw.rstrip()\n      \
          \  if not line.strip():\n            continue\n        if _is_noise_only(line):\n\
          \            dropped.append(line)\n            continue\n        # 无噪音词但也不像硬件行时：若整段几乎都是硬件上下文仍可能保留\n\
          \        # MVP：无噪音则保留，避免误杀未收录格式\n        kept.append(line)\n    return \"\
          \\n\".join(kept), dropped\n\n\ndef _normalize_hex(code: str | None) -> str:\n\
          \    if not code:\n        return \"\"\n    code = code.strip()\n    if\
          \ not code:\n        return \"\"\n    if code.lower().startswith(\"0x\"\
          ):\n        return \"0x\" + code[2:].lower()\n    # 纯十六进制补 0x；短十进制报错码也按十六进制惯例补前缀\n\
          \    if re.fullmatch(r\"[0-9a-fA-F]+\", code):\n        return \"0x\" +\
          \ code.lower()\n    return code\n\n\ndef extract_mce_features(block_text:\
          \ str) -> dict[str, str]:\n    \"\"\"从 MCE 块文本提取结构化特征（含 Bug1–4 修复）。\"\"\"\
          \n    location_parts: list[str] = []\n\n    cpu_m = _RE_CPU.search(block_text)\n\
          \    if cpu_m:\n        location_parts.append(f\"CPU {cpu_m.group(1)}\"\
          )\n\n    bank_m = _RE_BANK.search(block_text)\n    if bank_m:\n        location_parts.append(f\"\
          Bank {bank_m.group(1)}\")\n\n    if not location_parts:\n        sock_m\
          \ = _RE_SOCKET.search(block_text)\n        if sock_m:\n            location_parts.append(f\"\
          SOCKET {sock_m.group(1)}\")\n\n    location = \" \".join(location_parts)\
          \ if location_parts else \"Unknown\"\n\n    error_code = \"\"\n    code_m\
          \ = _RE_ERROR_CODE.search(block_text)\n    if code_m:\n        error_code\
          \ = _normalize_hex(code_m.group(1))\n    else:\n        status_m = _RE_STATUS.search(block_text)\n\
          \        if status_m:\n            error_code = _normalize_hex(status_m.group(1))\n\
          \n    error_description = \"\"\n    desc_m = _RE_ERR_DESC.search(block_text)\n\
          \    if desc_m:\n        error_description = desc_m.group(1).strip()\n \
          \   else:\n        mca_m = _RE_MCA_DESC.search(block_text)\n        if mca_m:\n\
          \            error_description = mca_m.group(1).strip()\n        else:\n\
          \            binit_m = _RE_BINIT.search(block_text)\n            if binit_m:\n\
          \                error_description = binit_m.group(1).strip()\n\n    # Bug4:\
          \ Corrected 优先判定为 Warning\n    severity = \"Unknown\"\n    if re.search(r\"\
          \\bCorrected\\b\", block_text, re.IGNORECASE):\n        severity = \"Warning\"\
          \n    elif re.search(\n        r\"\\bUncorrected\\b|\\bFatal\\b|\\bIERR\\\
          b|\\bUE\\b\",\n        block_text,\n        re.IGNORECASE,\n    ):\n   \
          \     severity = \"Critical\"\n    elif error_description:\n        severity\
          \ = \"Warning\"\n\n    return {\n        \"fault_type\": \"MCE\",\n    \
          \    \"component\": \"CPU\",\n        \"location\": location,\n        \"\
          error_code\": error_code,\n        \"error_description\": error_description,\n\
          \        \"severity\": severity,\n        \"vendor\": \"Generic\",\n   \
          \ }\n\n\ndef extract_edac_features(block_text: str) -> dict[str, str]:\n\
          \    location = \"Unknown\"\n    ch = re.search(r\"Channel\\s*(\\d+)\",\
          \ block_text, re.IGNORECASE)\n    dimm = re.search(r\"DIMM\\s*(\\d+)\",\
          \ block_text, re.IGNORECASE)\n    parts = []\n    if ch:\n        parts.append(f\"\
          Channel {ch.group(1)}\")\n    if dimm:\n        parts.append(f\"DIMM {dimm.group(1)}\"\
          )\n    if parts:\n        location = \", \".join(parts)\n\n    if re.search(r\"\
          \\bUE\\b|Uncorrected\", block_text, re.IGNORECASE):\n        code, severity\
          \ = \"UE\", \"Critical\"\n    elif re.search(r\"\\bCE\\b|Corrected\", block_text,\
          \ re.IGNORECASE):\n        code, severity = \"CE\", \"Warning\"\n    else:\n\
          \        code, severity = \"\", \"Unknown\"\n\n    desc_m = re.search(r\"\
          EDAC[^\\n]*\", block_text, re.IGNORECASE)\n    desc = desc_m.group(0).strip()\
          \ if desc_m else \"EDAC memory error\"\n\n    return {\n        \"fault_type\"\
          : \"Memory\",\n        \"component\": \"Memory\",\n        \"location\"\
          : location,\n        \"error_code\": code,\n        \"error_description\"\
          : desc,\n        \"severity\": severity,\n        \"vendor\": \"Generic\"\
          ,\n    }\n\n\ndef extract_pcie_features(block_text: str) -> dict[str, str]:\n\
          \    loc_m = re.search(r\"pcieport\\s+([0-9a-fA-F:.]+)\", block_text, re.IGNORECASE)\n\
          \    location = loc_m.group(1) if loc_m else \"Unknown\"\n    severity =\
          \ (\n        \"Critical\"\n        if re.search(r\"Uncorrected|Fatal\",\
          \ block_text, re.IGNORECASE)\n        else \"Warning\"\n    )\n    desc_m\
          \ = re.search(r\"(PCIe\\s+Bus\\s+Error|[^\\n]*\\bAER\\b[^\\n]*)\", block_text,\
          \ re.IGNORECASE)\n    desc = desc_m.group(1).strip() if desc_m else \"PCIe\
          \ AER error\"\n    return {\n        \"fault_type\": \"PCIe\",\n       \
          \ \"component\": \"PCIe\",\n        \"location\": location,\n        \"\
          error_code\": \"AER\",\n        \"error_description\": desc,\n        \"\
          severity\": severity,\n        \"vendor\": \"Generic\",\n    }\n\n\ndef\
          \ extract_ipmi_sensor(line: str) -> dict[str, str] | None:\n    if not _IPMI_SENSOR.search(line):\n\
          \        return None\n    component = \"Temperature\"\n    if re.search(r\"\
          \\bFan\\b\", line, re.IGNORECASE):\n        component = \"Fan\"\n    elif\
          \ re.search(r\"Voltage|PSU|Power\", line, re.IGNORECASE):\n        component\
          \ = \"Voltage\"\n\n    code = \"\"\n    m_temp = re.search(r\"(\\d+)\\s*°?C\"\
          , line, re.IGNORECASE)\n    m_rpm = re.search(r\"(\\d+)\\s*RPM\", line,\
          \ re.IGNORECASE)\n    if m_temp:\n        code = f\"{m_temp.group(1)}°C\"\
          \n    elif m_rpm:\n        code = f\"{m_rpm.group(1)} RPM\"\n\n    severity\
          \ = (\n        \"Critical\"\n        if re.search(r\"critical|failed\",\
          \ line, re.IGNORECASE)\n        else \"Warning\"\n    )\n    return {\n\
          \        \"fault_type\": \"IPMI_Sensor\",\n        \"component\": component,\n\
          \        \"location\": \"Unknown\",\n        \"error_code\": code or \"\
          SENSOR\",\n        \"error_description\": line.strip(),\n        \"severity\"\
          : severity,\n        \"vendor\": \"Generic\",\n    }\n\n\ndef extract_smart(line:\
          \ str) -> dict[str, str] | None:\n    if not _SMART.search(line):\n    \
          \    return None\n    dev_m = re.search(r\"(nvme\\d+n\\d+|sd[a-z]+|ata\\\
          d+)\", line, re.IGNORECASE)\n    location = dev_m.group(1) if dev_m else\
          \ \"Unknown\"\n    severity = (\n        \"Critical\"\n        if re.search(r\"\
          fail|UNC|error\", line, re.IGNORECASE)\n        else \"Warning\"\n    )\n\
          \    return {\n        \"fault_type\": \"SMART\",\n        \"component\"\
          : \"Disk\",\n        \"location\": location,\n        \"error_code\": \"\
          SMART\",\n        \"error_description\": line.strip(),\n        \"severity\"\
          : severity,\n        \"vendor\": \"Generic\",\n    }\n\n\ndef extract_nic(line:\
          \ str) -> dict[str, str] | None:\n    if not _NIC.search(line):\n      \
          \  return None\n    iface_m = re.search(r\"(eth\\d+|ens\\d+\\w*|enp\\S+)\"\
          , line, re.IGNORECASE)\n    location = iface_m.group(1) if iface_m else\
          \ \"Unknown\"\n    return {\n        \"fault_type\": \"Network\",\n    \
          \    \"component\": \"NIC\",\n        \"location\": location,\n        \"\
          error_code\": \"LINK\",\n        \"error_description\": line.strip(),\n\
          \        \"severity\": \"Warning\",\n        \"vendor\": \"Generic\",\n\
          \    }\n\n\ndef _is_pure_mce(cleaned: str) -> bool:\n    \"\"\"降噪后是否仅含 MCE（无\
          \ EDAC / IPMI / SMART / PCIe / 网卡）。\"\"\"\n    if not cleaned.strip():\n\
          \        return False\n    has_mce = bool(\n        re.search(r\"MCE|Machine\\\
          s+Check|Hardware\\s+event|Hardware\\s+Error|mce:\", cleaned, re.I)\n   \
          \ )\n    if not has_mce:\n        return False\n    has_other = bool(\n\
          \        re.search(r\"\\bEDAC\\b\", cleaned, re.I)\n        or _IPMI_SENSOR.search(cleaned)\n\
          \        or _SMART.search(cleaned)\n        or _PCIE_START.search(cleaned)\n\
          \        or _NIC.search(cleaned)\n    )\n    return not has_other\n\n\n\
          def _flush_block(\n    kind: str,\n    lines: list[str],\n    faults: list[dict[str,\
          \ str]],\n) -> None:\n    if not lines:\n        return\n    text = \"\\\
          n\".join(lines)\n    if kind == \"mce\":\n        faults.append(extract_mce_features(text))\n\
          \    elif kind == \"edac\":\n        faults.append(extract_edac_features(text))\n\
          \    elif kind == \"pcie\":\n        faults.append(extract_pcie_features(text))\n\
          \n\ndef scan_faults(cleaned_log: str) -> tuple[list[dict[str, str]], list[str]]:\n\
          \    \"\"\"多故障状态机：逐行扫描，返回 faults 与未识别行。\"\"\"\n    faults: list[dict[str,\
          \ str]] = []\n    unmatched: list[str] = []\n\n    if _is_pure_mce(cleaned_log):\n\
          \        # 快速通道：整段作为 MCE 输入\n        faults.append(extract_mce_features(cleaned_log))\n\
          \        return faults, unmatched\n\n    in_mce = in_edac = in_pcie = False\n\
          \    block: list[str] = []\n    kind = \"\"\n\n    def _close() -> None:\n\
          \        nonlocal in_mce, in_edac, in_pcie, block, kind\n        if kind\
          \ and block:\n            _flush_block(kind, block, faults)\n        in_mce\
          \ = in_edac = in_pcie = False\n        block = []\n        kind = \"\"\n\
          \n    for line in cleaned_log.splitlines():\n        # ---- 块内续行 ----\n\
          \        if in_mce:\n            if _MCE_CONTINUE.search(line) or _MCE_START.search(line):\n\
          \                block.append(line)\n                continue\n        \
