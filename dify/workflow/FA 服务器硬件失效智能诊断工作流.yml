          \    full_system_prompt = f\"\"\" 你是一名拥有 10 年以上经验的资深服务器硬件失效分析工程师，现服务于大型数据中心。你必须严格依据下面的故障日志原文、特征提取结果和知识库参考内容进行严谨推导，生成专业、可操作的\
